<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <!-- Marco angular del Hero: banda en chevrón (60 u de grosor horizontal) con franjas de precaución
       negras y naranjas, borde cromado fino a ambos lados, volumen mediante reflejo y sombra
       longitudinales, borde naranja en los lados superior, derecho e inferior, y filo naranja de
       intensidad variable con puntos de luz atenuados.
       Ventana de la foto (clip-path en styles.css): 254,16 984,16 984,784 74,784 199,533 99,342. -->
  <defs>
    <!-- Facetas de cromo pulido: transiciones marcadas entre reflejos claros y oscuros -->
    <linearGradient id="chromeLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfe" />
      <stop offset="0.16" stop-color="#c9d4dc" />
      <stop offset="0.3" stop-color="#eef3f6" />
      <stop offset="0.44" stop-color="#7d8e9b" />
      <stop offset="0.52" stop-color="#dfe6eb" />
      <stop offset="0.7" stop-color="#a7b5c0" />
      <stop offset="0.86" stop-color="#f4f7f9" />
      <stop offset="1" stop-color="#93a3af" />
    </linearGradient>
    <linearGradient id="chromeMidLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e0e6" />
      <stop offset="0.35" stop-color="#9eaeba" />
      <stop offset="0.7" stop-color="#eef3f6" />
      <stop offset="1" stop-color="#aab8c3" />
    </linearGradient>
    <!-- Franjas de precaución: cinta plegada (reflejo exacto en cada unión). Generado por
         docs/tools/generate_hazard_stripes.py: período 83,333 u y franja negra 24,8 u en perpendicular. -->
    <path id="hazardStripes" d="M649.63 -1341.69 L1561.22 1305.76 L1537.77 1313.83 L626.18 -1333.62 Z M570.84 -1314.56 L1482.43 1332.89 L1458.98 1340.96 L547.39 -1306.49 Z M492.04 -1287.43 L1403.63 1360.02 L1380.18 1368.09 L468.59 -1279.36 Z M413.25 -1260.30 L1324.84 1387.15 L1301.39 1395.22 L389.80 -1252.23 Z M334.46 -1233.17 L1246.05 1414.28 L1222.60 1422.35 L311.01 -1225.10 Z M255.66 -1206.04 L1167.25 1441.41 L1143.81 1449.48 L232.22 -1197.97 Z M176.87 -1178.91 L1088.46 1468.54 L1065.01 1476.62 L153.42 -1170.84 Z M98.08 -1151.78 L1009.67 1495.67 L986.22 1503.75 L74.63 -1143.71 Z M19.29 -1124.65 L930.88 1522.80 L907.43 1530.88 L-4.16 -1116.58 Z M-59.51 -1097.52 L852.08 1549.93 L828.63 1558.01 L-82.96 -1089.45 Z M-138.30 -1070.39 L773.29 1577.06 L749.84 1585.14 L-161.75 -1062.31 Z M-217.09 -1043.26 L694.50 1604.19 L671.05 1612.27 L-240.54 -1035.18 Z M-295.89 -1016.13 L615.70 1631.32 L592.26 1639.40 L-319.34 -1008.05 Z M-374.68 -989.00 L536.91 1658.46 L513.46 1666.53 L-398.13 -980.92 Z M-453.47 -961.87 L458.12 1685.59 L434.67 1693.66 L-476.92 -953.79 Z M-532.26 -934.74 L379.33 1712.72 L355.88 1720.79 L-555.71 -926.66 Z M-611.06 -907.61 L300.53 1739.85 L277.08 1747.92 L-634.51 -899.53 Z M-689.85 -880.47 L221.74 1766.98 L198.29 1775.05 L-713.30 -872.40 Z M-768.64 -853.34 L142.95 1794.11 L119.50 1802.18 L-792.09 -845.27 Z M-847.44 -826.21 L64.15 1821.24 L40.71 1829.31 L-870.89 -818.14 Z M-926.23 -799.08 L-14.64 1848.37 L-38.09 1856.44 L-949.68 -791.01 Z M-1005.02 -771.95 L-93.43 1875.50 L-116.88 1883.57 L-1028.47 -763.88 Z M-1083.82 -744.82 L-172.22 1902.63 L-195.67 1910.70 L-1107.26 -736.75 Z M-1162.61 -717.69 L-251.02 1929.76 L-274.47 1937.83 L-1186.06 -709.62 Z M-1241.40 -690.56 L-329.81 1956.89 L-353.26 1964.97 L-1264.85 -682.49 Z M-1320.19 -663.43 L-408.60 1984.02 L-432.05 1992.10 L-1343.64 -655.36 Z M-1398.99 -636.30 L-487.40 2011.15 L-510.84 2019.23 L-1422.44 -628.23 Z M-1477.78 -609.17 L-566.19 2038.28 L-589.64 2046.36 L-1501.23 -601.09 Z M-1556.57 -582.04 L-644.98 2065.41 L-668.43 2073.49 L-1580.02 -573.96 Z" />
    <clipPath id="hazardSeg1"><path d="M214 0 H274 L106 342.6 H45 Z" /></clipPath>
    <clipPath id="hazardSeg2"><path d="M45 341.4 H106 L206 533.6 L144 537.6 Z" /></clipPath>
    <clipPath id="hazardSeg3"><path d="M144 536.4 L206 532.4 L72 800 H0 Z" /></clipPath>
    <clipPath id="bandClip">
      <path d="M214 0 H274 L106 342 L206 533 L72 800 H0 L144 537 L45 342 Z" />
    </clipPath>
    <!-- Luces -->
    <radialGradient id="hotspot">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.95" />
      <stop offset="0.18" stop-color="#ffb04a" stop-opacity="0.85" />
      <stop offset="0.5" stop-color="#ff8a00" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa53a" stop-opacity="1" />
      <stop offset="0.22" stop-color="#ff8a00" stop-opacity="0.7" />
      <stop offset="0.43" stop-color="#ffc06a" stop-opacity="1" />
      <stop offset="0.58" stop-color="#ff8a00" stop-opacity="0.7" />
      <stop offset="0.85" stop-color="#ff8a00" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffa53a" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="borderTop" x1="250" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a1f" />
      <stop offset="0.3" stop-color="#e06c00" />
      <stop offset="0.75" stop-color="#ea7600" />
      <stop offset="1" stop-color="#ffa53a" />
    </linearGradient>
    <linearGradient id="borderSide" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa53a" />
      <stop offset="0.35" stop-color="#e06c00" />
      <stop offset="0.7" stop-color="#e57200" />
      <stop offset="1" stop-color="#ffa53a" />
    </linearGradient>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Integración con la foto: viñeta interior y sombra que proyecta la banda -->
  <path d="M254 16 H984 V784 H74" fill="none" stroke="#000000" stroke-width="34" opacity="0.3" filter="url(#blur6)" />
  <path d="M282 0 L114 342 L214 533 L80 800" fill="none" stroke="#000000" stroke-width="20" opacity="0.5" filter="url(#blur6)" />

  <!-- Borde naranja: lámina con canto claro, canto oscuro y luz en las esquinas -->
  <path d="M240 8 H992 V792 H50" fill="none" stroke="#7a3500" stroke-width="16" stroke-linejoin="miter" />
  <path d="M240 8 H992" fill="none" stroke="url(#borderTop)" stroke-width="12" />
  <path d="M992 8 V792" fill="none" stroke="url(#borderSide)" stroke-width="12" />
  <path d="M992 792 H50" fill="none" stroke="url(#borderTop)" stroke-width="12" />
  <path d="M240 2.5 H997.5 V797.5 H50" fill="none" stroke="#ffd29a" stroke-width="1.4" stroke-opacity="0.6" />
  <path d="M254 15 H985 V785 H74" fill="none" stroke="#140a02" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Banda de precaución: franjas, volumen y borde cromado, todo dentro de la geometría de la banda -->
  <g clip-path="url(#bandClip)">
    <path d="M214 0 H274 L106 342 L206 533 L72 800 H0 L144 537 L45 342 Z" fill="#ef7d00" />
    <g clip-path="url(#hazardSeg1)" fill="#141619"><use href="#hazardStripes" /></g>
    <g clip-path="url(#hazardSeg2)" fill="#141619"><use href="#hazardStripes" transform="matrix(1 0 0 -1 0 684)" /></g>
    <g clip-path="url(#hazardSeg3)" fill="#141619"><use href="#hazardStripes" transform="matrix(0.99171 -0.128497 0.128497 0.99171 -17.695337 409.72228)" /></g>
    <!-- volumen: reflejo cerca del filo exterior y sombra hacia el lado de la fotografía -->
    <path d="M231 0 L62 342 L161 536 L17 800" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.2" filter="url(#blur3)" />
    <path d="M257 0 L89 342 L189 534 L55 800" fill="none" stroke="#000000" stroke-width="12" opacity="0.32" filter="url(#blur3)" />
    <!-- reflejos especulares discretos -->
    <path d="M150 64 L240 100 L230 120 L140 84 Z" fill="#ffffff" opacity="0.16" filter="url(#blur3)" />
    <path d="M50 646 L170 692 L160 712 L40 666 Z" fill="#ffffff" opacity="0.14" filter="url(#blur3)" />
    <!-- borde cromado fino (≈7 u visibles) en ambos filos -->
    <path d="M214 0 L45 342 L144 537 L0 800" fill="none" stroke="url(#chromeLit)" stroke-width="14" stroke-linejoin="miter" />
    <path d="M274 0 L106 342 L206 533 L72 800" fill="none" stroke="url(#chromeMidLit)" stroke-width="14" stroke-linejoin="miter" />
  </g>
  <!-- aristas del cromo -->
  <path d="M221 0 L52 342 L151 537 L7 800" fill="none" stroke="#0a131c" stroke-opacity="0.55" stroke-width="1.2" />
  <path d="M267 0 L99 342 L199 533 L65 800" fill="none" stroke="#0a131c" stroke-opacity="0.55" stroke-width="1.2" />
  <path d="M214 0 L45 342 L144 537 L0 800" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.8" />
  <path d="M274 0 L106 342 L206 533 L72 800" fill="none" stroke="#0a131c" stroke-opacity="0.8" stroke-width="2.6" />

  <!-- Filo naranja en la arista exterior: resplandor suave + línea de intensidad variable -->
  <path d="M212 0 L43 342 L142 537 L-2 800" fill="none" stroke="#ff8a00" stroke-width="12" opacity="0.12" filter="url(#blur6)" />
  <path d="M211 1 L42 342 L141 537 L-2 800" fill="none" stroke="url(#edgeFade)" stroke-width="4.5" stroke-linejoin="miter" />

  <!-- Puntos de luz localizados -->
  <g style="mix-blend-mode: screen">
    <ellipse cx="44" cy="342" rx="34" ry="56" fill="url(#hotspot)" opacity="0.4" />
    <ellipse cx="212" cy="4" rx="46" ry="22" fill="url(#hotspot)" opacity="0.32" />
    <ellipse cx="992" cy="8" rx="44" ry="30" fill="url(#hotspot)" opacity="0.75" />
    <ellipse cx="992" cy="792" rx="44" ry="30" fill="url(#hotspot)" opacity="0.7" />
    <ellipse cx="6" cy="796" rx="40" ry="26" fill="url(#hotspot)" opacity="0.32" />
    <ellipse cx="610" cy="8" rx="70" ry="10" fill="url(#hotspot)" opacity="0.45" />
  </g>

</svg>
