<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <!-- Placa triangular de acero cepillado para las esquinas del Hero, con filo naranja y remaches redondos.
       Orientada para la esquina superior izquierda; la inferior se obtiene reflejándola en CSS. -->
  <defs>
    <linearGradient id="cornerSteel" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#e9f0f5" />
      <stop offset="0.22" stop-color="#8d9fad" />
      <stop offset="0.42" stop-color="#d7e1e8" />
      <stop offset="0.62" stop-color="#5f7281" />
      <stop offset="0.82" stop-color="#b4c3ce" />
      <stop offset="1" stop-color="#6d808e" />
    </linearGradient>
    <pattern id="cornerBrush" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)">
      <rect width="4" height="0.9" fill="#ffffff" opacity="0.18" />
      <rect y="2" width="4" height="0.7" fill="#0b1520" opacity="0.08" />
    </pattern>
    <radialGradient id="cornerRivet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.3" stop-color="#cfdae2" />
      <stop offset="0.7" stop-color="#6c7f8d" />
      <stop offset="1" stop-color="#1b2934" />
    </radialGradient>
    <filter id="cornerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <g id="cornerRivetMark">
      <circle r="10.5" fill="#0a131c" opacity="0.5" transform="translate(1.5 2.2)" />
      <circle r="9" fill="url(#cornerRivet)" stroke="#2a3946" stroke-width="1.1" />
      <ellipse cx="-2.8" cy="-3.1" rx="2.9" ry="2" fill="#ffffff" opacity="0.75" />
    </g>
  </defs>
  <path d="M0 0 H184 L0 232 Z" fill="url(#cornerSteel)" />
  <path d="M0 0 H184 L0 232 Z" fill="url(#cornerBrush)" />
  <path d="M184 0 L0 232" stroke="#ff8a00" stroke-width="10" opacity="0.3" filter="url(#cornerGlow)" />
  <path d="M182 0 L0 229.5" stroke="#f08000" stroke-width="2.4" stroke-opacity="0.85" />
  <path d="M176 0 L0 222" stroke="#0b141d" stroke-opacity="0.45" stroke-width="2" />
  <use href="#cornerRivetMark" transform="translate(30 30)" />
  <use href="#cornerRivetMark" transform="translate(94 30)" />
  <use href="#cornerRivetMark" transform="translate(30 104)" />
</svg>
